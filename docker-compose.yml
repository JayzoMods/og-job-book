services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: jobbook
      POSTGRES_PASSWORD: jobbook
      POSTGRES_DB: jobbook
    ports:
      - "5433:5432"
    volumes:
      - jobbook_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

volumes:
  jobbook_pg:
